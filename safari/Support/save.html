<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>保存文件 · PhotoShow Safari</title><link rel="stylesheet" href="save.css"><script defer src="save.js"></script></head>
<body><main><h1>保存文件</h1><p id="status" role="status">正在准备文件…</p><p id="filename"></p><img id="preview" hidden alt="待保存图片预览"><a id="save" hidden>点击保存</a><p class="hint">请点击保存；Safari 决定最终文件名和目录。此页面不会报告下载完成。若图片未直接下载，可右键预览图片并选择保存。</p><p class="hint">保存后可以关闭本页。刷新本页需回到原网页重新发起保存。</p></main></body>
